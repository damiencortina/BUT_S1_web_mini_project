{% extends 'layout.html' %}

{% block body %}
<a class="btn btn-primary" href="/type-ski/add" role="button">Ajouter un type de ski</a>
<table class="table">
    <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Libellé</th>
            <th scope="col">Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for typeSki in typeSki %}
        <tr>
            <th scope="row">{{typeSki.id}}</th>
            <td>{{typeSki.libelleType}}</td>
            <td>
                <a class="btn btn-link" href="/type-ski/edit?id={{typeSki.id}}" role="button">Modifier</a>
                <a class="btn btn-danger" href="/type-ski/delete?id={{typeSki.id}}" role="button">Supprimer</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock body %}
