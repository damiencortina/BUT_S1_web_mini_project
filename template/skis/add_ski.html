{% extends 'layout.html' %}

{% block body %}
<form action="/ski/add" method="post">
  <div class="mb-3">
    <label for="skiModele" class="form-label">Modèle</label>
    <input type="text" class="form-control" id="skiModele">
  </div>
  <div class="mb-3">
    <label for="skiDateAchat" class="form-label">Date achat</label>
    <input type="date" class="form-control" id="skiDateAchat">
  </div>
  <div class="mb-3">
    <label for="skiEtat" class="form-label">Etat</label>
    <input type="text" class="form-control" id="skiEtat">
  </div>
  <div class="mb-3">
    <label for="skiPrixAchat" class="form-label">Prix d'achat</label>
    <input type="text" class="form-control" id="skiPrixAchat">
  </div>
  <div class="mb-3">
    <label for="skiPrixLocation" class="form-label">Prix location</label>
    <input type="text" class="form-control" id="skiPrixLocation">
  </div>
  <div class="mb-3">
    <label for="skiTaille" class="form-label">Taille</label>
    <input type="text" class="form-control" id="skiTaille">
  </div>
  <div class="mb-3">
    <select class="form-select">
      {% for typeSki in typesSki %}
      <option value="{{typeSki.libelleType}}">{{typeSki.libelleType}}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label for="skiImage" class="form-label">Image</label>
    <input type="text" class="form-control" id="skiImage">
  </div>
  <button type="submit" class="btn btn-primary">Valider</button>
</form>
{% endblock body %}
