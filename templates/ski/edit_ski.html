{% extends 'layout.html' %}

{% block header %}
<div class="px-4 py-5 my-5 text-center">
    <h1 class="display-5">Modifier le modèle de ski : <strong>{{ski.modeleSki}}</strong></h1>
</div>
{% endblock header %}

{% block body %}
<form action="/ski/edit" method="post">
  <input type="hidden" name="id" value="{{ski.id}}">
  <div class="mb-3">
    <label for="modeleSki" class="form-label">Modèle</label>
    <input required type="text" class="form-control" id="modeleSki" name="modeleSki" placeholder="Saisir le modèle" value="{{ski.modeleSki}}">
  </div>
  <div class="mb-3">
    <label for="dateAchat" class="form-label">Date achat</label>
    <input type="date" class="form-control" id="dateAchat" name="dateAchat" value="{{ski.dateAchat}}">
  </div>
  <div class="mb-3">
    <label for="etat" class="form-label">Etat</label>
    <input type="text" class="form-control" id="etat" name="etat" placeholder="Saisir l'état" value="{{ski.etat}}">
  </div>
  <div class="mb-3">
    <label for="prixAchat" class="form-label">Prix d'achat(€)</label>
    <input type="number" class="form-control" id="prixAchat" name="prixAchat" placeholder="Saisir le prix d'achat" value="{{ski.prixAchat}}">
  </div>
  <div class="mb-3">
    <label for="prixLocation" class="form-label">Prix location(€)</label>
    <input type="number" class="form-control" id="prixLocation" name="prixLocation" placeholder="Saisir le prix de location" value="{{ski.prixLocation}}">
  </div>
  <div class="mb-3">
    <label for="taille" class="form-label">Taille(cm)</label>
    <input type="number" class="form-control" id="taille" name="taille" placeholder="Saisir la taille" value="{{ski.taille}}">
  </div>
  <div class="mb-3">
    <label for="typeSki_id" class="form-label">Type de ski</label>
    <select class="form-select" id="typeSki_id" name="typeSki_id">
      {% for typeSki in typesSki %}
      {% if typeSki.id == ski.typeSki_id %}
      <option value="{{typeSki.id}}" selected>{{typeSki.libelleType}}</option>
      {% else %}
      <option value="{{typeSki.id}}">{{typeSki.libelleType}}</option>
      {% endif %}
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label for="imageSki" class="form-label">Image</label>
    <input type="text" class="form-control" id="imageSki" name="imageSki" placeholder="Saisir le nom de l'image" value="{{ski.imageSki}}">
  </div>
  <button type="submit" class="btn btn-primary">Valider</button>
</form>
{% endblock body %}
